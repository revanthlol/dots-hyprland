include=~/.config/fuzzel/fuzzel_theme.ini

font=Google Sans Flex:size=11:weight=medium
terminal=kitty -1
prompt=">> "
placeholder="Search apps..."
layer=overlay
anchor=center
width=42
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=24
dpi-aware=yes
show-actions=no
exit-immediately-if-empty=yes
match-mode=fzf

[border]
radius=17
selection-radius=17
width=1
